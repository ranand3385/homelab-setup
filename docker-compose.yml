services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - ${JELLYFIN_PORT}:${JELLYFIN_PORT}
    volumes:
      - ~/docker/jellyfin/config:/config
      - /mnt/media:/media
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - ${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}
      - ${TORRENT_PORT}:${TORRENT_PORT}
      - ${TORRENT_PORT}:${TORRENT_PORT}/udp
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - TZ=${TZ}
    volumes:
      - ~/docker/gluetun:/tmp/gluetun

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    volumes:
      - ~/docker/qbittorrent/config:/config
      - /mnt/media:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=${QBIT_WEBUI_PORT}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - ${RADARR_PORT}:${RADARR_PORT}
    volumes:
      - ~/docker/radarr/config:/config
      - /mnt/media:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - ${SONARR_PORT}:${SONARR_PORT}
    volumes:
      - ~/docker/sonarr/config:/config
      - /mnt/media:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - ${PROWLARR_PORT}:${PROWLARR_PORT}
    volumes:
      - ~/docker/prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - ${JELLYSEERR_PORT}:${JELLYSEERR_PORT}
    volumes:
      - ~/docker/jellyseerr/config:/app/config
    environment:
      - TZ=${TZ}

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - ${WIREGUARD_PORT}:${WIREGUARD_PORT}/udp
    volumes:
      - ~/docker/wireguard/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=auto
      - PEERS=phone,laptop
      - PEERDNS=1.1.1.1
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - ${FLARESOLVERR_PORT}:${FLARESOLVERR_PORT}
    environment:
      - TZ=${TZ}

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *

  seadexerr:
    image: ghcr.io/ryder-c/seadexerr:latest
    container_name: seadexerr
    restart: unless-stopped
    ports:
      - ${SEADEXERR_PORT}:${SEADEXERR_PORT}
    environment:
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_BASE_URL=http://sonarr:${SONARR_PORT}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_BASE_URL=http://radarr:${RADARR_PORT}
      - SEADEXERR_PORT=${SEADEXERR_PORT}
    volumes:
      - ~/docker/seadexerr:/data

  seadexarr:
    image: ghcr.io/bbtufty/seadexarr:latest
    container_name: seadexarr
    volumes:
      - ~/docker/seadexarr/config:/config
    environment:
      - TZ=${TZ}
