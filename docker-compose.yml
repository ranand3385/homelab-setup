services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - ${JELLYFIN_PORT}:${JELLYFIN_PORT}
    volumes:
      - ~/docker/jellyfin/config:/config
      - ${MEDIA_ROOT}:/media
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=${TZ}

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - ${QBIT_WEBUI_PORT}:${QBIT_WEBUI_PORT}
      - ${TORRENT_PORT}:${TORRENT_PORT}
      - ${TORRENT_PORT}:${TORRENT_PORT}/udp
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - TZ=${TZ}
    volumes:
      - ~/docker/gluetun:/tmp/gluetun

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    volumes:
      - ~/docker/qbittorrent/config:/config
      - ${MEDIA_ROOT}:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=${QBIT_WEBUI_PORT}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - ${RADARR_PORT}:${RADARR_PORT}
    volumes:
      - ~/docker/radarr/config:/config
      - ${MEDIA_ROOT}:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    ports:
      - ${SONARR_PORT}:${SONARR_PORT}
    volumes:
      - ~/docker/sonarr/config:/config
      - ${MEDIA_ROOT}:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    ports:
      - ${PROWLARR_PORT}:${PROWLARR_PORT}
    volumes:
      - ~/docker/prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - PROWLARR__SERVER__ENABLEIPV6=false
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - ${JELLYSEERR_PORT}:${JELLYSEERR_PORT}
    volumes:
      - ~/docker/jellyseerr/config:/app/config
    environment:
      - TZ=${TZ}

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - ${WIREGUARD_PORT}:${WIREGUARD_PORT}/udp
    volumes:
      - ~/docker/wireguard/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=auto
      - PEERS=phone,laptop
      - PEERDNS=1.1.1.1
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - ${FLARESOLVERR_PORT}:${FLARESOLVERR_PORT}
    environment:
      - TZ=${TZ}

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - DOCKER_API_VERSION=1.45

  seadexerr:
    image: ghcr.io/ryder-c/seadexerr:latest
    container_name: seadexerr
    restart: unless-stopped
    ports:
      - ${SEADEXERR_PORT}:${SEADEXERR_PORT}
    environment:
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_BASE_URL=http://sonarr:${SONARR_PORT}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - RADARR_BASE_URL=http://radarr:${RADARR_PORT}
      - SEADEXERR_PORT=${SEADEXERR_PORT}
    volumes:
      - ~/docker/seadexerr:/data

  seadexarr:
    image: ghcr.io/bbtufty/seadexarr:latest
    container_name: seadexarr
    volumes:
      - ~/docker/seadexarr/config:/config
    environment:
      - TZ=${TZ}
  
  couchdb:
    image: couchdb:latest
    container_name: couchdb-for-ols
    user: 5984:5984
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - ~/docker/couchdb-data:/opt/couchdb/data
      - ~/docker/couchdb-etc:/opt/couchdb/etc/local.d
    ports:
      - ${COUCHDB_PORT}:${COUCHDB_PORT}
    restart: unless-stopped

  ts-actual-server:
    image: tailscale/tailscale:latest
    container_name: ts-actual-server
    hostname: ${TS_HOSTNAME}
    restart: unless-stopped
    ports:
      - ${ACTUAL_PORT}:${ACTUAL_PORT}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_SERVE_CONFIG=/config/serve-config.json
    volumes:
      - ~/docker/actual/ts-state:/var/lib/tailscale
      - ~/docker/actual/ts-config:/config
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN

  actual:
    image: actualbudget/actual-server:latest
    container_name: actual
    restart: unless-stopped
    network_mode: service:ts-actual-server
    depends_on:
      - ts-actual-server
    volumes:
      - ~/docker/actual:/data
    environment:
      - TZ=${TZ}

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
      - FTLCONF_webserver_api_password=${PIHOLE_WEBPASSWORD}
      - FTLCONF_dns_listeningMode=ALL
    volumes:
      - ~/docker/pihole/etc-pihole:/etc/pihole
      - ~/docker/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    ports:
      - ${BAZARR_PORT}:${BAZARR_CONTAINER_PORT}
    volumes:
      - ~/docker/bazarr/config:/config
      - ${MEDIA_ROOT}:/media
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "1000:1000"
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ~/docker/recyclarr/config:/config

  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    ports:
      - ${KAVITA_PORT}:${KAVITA_PORT}
    volumes:
      - ~/docker/kavita/config:/config
      - ${MEDIA_ROOT}/manga:/data/manga
      - ${MEDIA_ROOT}/comics:/data/comics
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}

  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:stable
    container_name: suwayomi
    restart: unless-stopped
    ports:
      - ${SUWAYOMI_PORT}:${SUWAYOMI_PORT}
    volumes:
      - ~/docker/suwayomi/data:/home/suwayomi/.local/share/Tachidesk
      - ${MEDIA_ROOT}/manga:/home/suwayomi/.local/share/Tachidesk/downloads
    environment:
      - TZ=${TZ}
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:${FLARESOLVERR_PORT}

  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: unless-stopped
    ports:
      - ${KAPOWARR_PORT}:${KAPOWARR_PORT}
    volumes:
      - ~/docker/kapowarr/db:/app/db
      - ${MEDIA_ROOT}/downloads/kapowarr-temp:/app/temp_downloads
      - ${MEDIA_ROOT}/comics:/comics
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}


  komga:
    image: gotson/komga:latest
    container_name: komga
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - ${KOMGA_PORT}:${KOMGA_PORT}
    volumes:
      - ~/docker/komga/config:/config
      - ${MEDIA_ROOT}/manga:/data/manga:ro
      - ${MEDIA_ROOT}/comics:/data/comics:ro
    environment:
      - TZ=${TZ}
